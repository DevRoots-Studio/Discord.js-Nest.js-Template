services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: discord_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/discord_app
      PORT: 3000
      BOT_BRIDGE_URL: http://discord-bot:3100
      BRIDGE_SECRET: ${BRIDGE_SECRET:-change-me-in-production}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3

  discord-bot:
    build:
      context: .
      dockerfile: apps/discord-bot/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/discord_app
      BOT_TOKEN: ${BOT_TOKEN}
      BRIDGE_PORT: 3100
      BRIDGE_SECRET: ${BRIDGE_SECRET:-change-me-in-production}
      API_URL: http://api:3000
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  postgres_data:
